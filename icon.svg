<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <pattern id="grid" width="73.14" height="73.14" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect width="73.14" height="73.14" fill="none" stroke="#2C7259" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#06231A" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E3BE"/>
      <stop offset="1" stop-color="#E2CB98"/>
    </linearGradient>
  </defs>
  <!-- Board -->
  <rect width="512" height="512" fill="#1F5E4A"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- Premium squares -->
  <rect x="1.5" y="1.5" width="70" height="70" fill="#C8433A"/>
  <rect x="438.9" y="438.9" width="70" height="70" fill="#C8433A"/>
  <rect x="438.9" y="1.5" width="70" height="70" fill="#E7A3AB"/>
  <rect x="1.5" y="438.9" width="70" height="70" fill="#E7A3AB"/>
  <rect x="219.4" y="1.5" width="70" height="70" fill="#A9D0E8"/>
  <rect x="219.4" y="438.9" width="70" height="70" fill="#A9D0E8"/>
  <rect x="1.5" y="219.4" width="70" height="70" fill="#2F6FA8"/>
  <rect x="438.9" y="219.4" width="70" height="70" fill="#2F6FA8"/>
  <!-- Tile -->
  <g transform="rotate(-7 256 256)" filter="url(#shadow)">
    <rect x="106" y="112" width="300" height="300" rx="34" fill="#B89B62"/>
    <rect x="106" y="100" width="300" height="296" rx="34" fill="url(#wood)"/>
    <text x="250" y="320" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="230" fill="#2A2015">S</text>
    <text x="372" y="368" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="54" fill="#2A2015">1</text>
  </g>
</svg>
